[project]
name = "bazaar-kit"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Aleksandar Varga", email = "aleksandar.varga@proton.me" }
]
requires-python = ">=3.13"
dependencies = [
    "anthropic>=1.8.0",
    "pydantic>=2.13",
    "python-dotenv>=1.2.4",
]

[project.scripts]
bazaar-kit = "bazaar_kit:main"

[build-system]
requires = ["uv_build>=0.12.20,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
